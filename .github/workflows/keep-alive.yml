name: Keep Backend Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render's free tier from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          echo "Pinging backend at $(date)..."
          # --max-time 60: wait up to 60s for Render cold start
          # --retry 2: retry on failure
          status_code=$(curl -o /dev/null -s -w "%{http_code}" --max-time 60 --retry 2 -L "https://manifest-system-esft.onrender.com/api/health")
          echo "Backend responded with HTTP status: $status_code"
          if [ "$status_code" -ne 200 ]; then
            echo "Warning: Backend returned $status_code (not 200). Render may be restarting."
          else
            echo "Backend is alive and healthy."
          fi
