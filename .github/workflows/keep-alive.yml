name: Keep Backend Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render's free tier from sleeping
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          echo "Pinging backend at $(date)..."
          # || echo "000" prevents curl's own exit code from failing the step
          # The sole purpose of this job is to send a request to wake Render up
          status_code=$(curl -o /dev/null -s -w "%{http_code}" --max-time 60 -L "https://manifest-system-esft.onrender.com/api/health" || echo "000")
          echo "Backend responded with HTTP status: $status_code"
          if [ "$status_code" = "200" ]; then
            echo "Backend is alive and healthy."
          else
            echo "Notice: Backend returned $status_code — Render cold start in progress or server restarting. This is not a failure."
          fi
