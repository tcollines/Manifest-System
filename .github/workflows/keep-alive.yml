name: Keep Backend Alive

on:
  schedule:
    # Run every 5 minutes to prevent Render's sleep
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          echo "Pinging backend health endpoint..."
          # Use -s to check status code, -L to follow redirects
          status_code=$(curl -o /dev/null -s -w "%{http_code}\n" -L "https://manifest-system-esft.onrender.com/api/health")
          echo "Backend responded with status: $status_code"
          
          if [ "$status_code" -ne 200 ]; then
            echo "Warning: Backend did not return 200 OK"
            exit 1
          fi
