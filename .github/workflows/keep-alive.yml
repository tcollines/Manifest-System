name: Keep Backend Alive

on:
  schedule:
    # Run every 14 minutes to prevent Render's 15-minute sleep
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          echo "Pinging backend to prevent cold start..."
          curl -I "https://manifest-system-esft.onrender.com"
          echo "Ping sent to https://manifest-system-esft.onrender.com"
