<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/MANIFEST.png" />
  <link rel="apple-touch-icon" href="/MANIFEST.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <title>Manifest MS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // AGGRESSIVE ERROR LOGGER
    window.addEventListener('error', function (e) {
      const errorContainer = document.getElementById('error-container') || document.createElement('div');
      errorContainer.id = 'error-container';
      errorContainer.style.position = 'fixed';
      errorContainer.style.top = '0';
      errorContainer.style.left = '0';
      errorContainer.style.width = '100%';
      errorContainer.style.backgroundColor = '#fae8e8';
      errorContainer.style.color = '#c0392b';
      errorContainer.style.padding = '20px';
      errorContainer.style.zIndex = '9999';
      errorContainer.style.borderBottom = '2px solid #e74c3c';
      errorContainer.style.fontFamily = 'monospace';
      errorContainer.style.fontSize = '14px';

      let msg = '';
      if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK' || e.target.tagName === 'IMG')) {
        msg = 'Resource Failed to Load: ' + (e.target.src || e.target.href);
      } else if (e.message) {
        msg = e.message;
      } else {
        // Fallback for unknown errors (often harmless or noise)
        console.error('Unhandled error caught by logger:', e);
        return;
      }

      errorContainer.innerHTML += '<strong>Error:</strong> ' + msg + '<br>';
      document.body.prepend(errorContainer);
    }, true); // Capture phase to get resource errors

    window.addEventListener('unhandledrejection', function (e) {
      const errorContainer = document.getElementById('error-container') || document.createElement('div');
      errorContainer.innerHTML += '<strong>Promise Error:</strong> ' + (e.reason ? e.reason.message : e.reason) + '<br>';
      document.body.prepend(errorContainer);
    });
  </script>
  <!-- Google Sign-In Script is now loaded dynamically in SignIn.tsx -->
  <!-- Google Maps API Config handled via React components -->
  <script>
    // Polyfill process.env for browser environments to prevent crashes
    window.process = {
      env: {
        API_KEY: '', // Value will be injected or handled by the environment/bundler
        NODE_ENV: 'development'
      }
    };
  </script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ministry: {
              black: '#F3F4F6', // Main Background (Light Gray)
              dark: '#FFFFFF',  // Component Background (White)
              card: '#FFFFFF',  // Card Background (White)
              neon: '#ccff00', // Neon Green/Lime (Keep for accents)
              orange: '#FF5722', // Deep Orange
              text: '#111827', // Main Text (Gray 900)
              muted: '#6B7280' // Muted Text (Gray 500)
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F3F4F6;
      color: #111827;
    }

    /* Mobile Optimization: Reduce base font and padding */
    @media (max-width: 640px) {
      body {
        font-size: 14px;
        /* Slightly smaller base font */
      }

      h1 {
        font-size: 1.5rem !important;
      }

      /* Force smaller headings */
      h2 {
        font-size: 1.25rem !important;
      }

      h3 {
        font-size: 1.1rem !important;
      }

      .p-8 {
        padding: 1rem !important;
      }

      /* Override large paddings */
      .gap-8 {
        gap: 1rem !important;
      }
    }

    /* Custom Scrollbar - Light Theme */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #F3F4F6;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #FF5722;
    }

    /* Hide Spinners for Number Inputs */
    .no-spinner::-webkit-outer-spin-button,
    .no-spinner::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .no-spinner {
      -moz-appearance: textfield;
      appearance: none;
    }

    /* Hide scrollbar for horizontally scrollable tabs */
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }

    /* Global Scroll Anchor Offset for Sticky Headers */
    /* Removed scroll-behavior: smooth; to prevent interference with manual ScrollRestoration */
    :target {
      scroll-margin-top: 5rem; /* Account for sticky top navbars */
    }

    /* Accessibility Focus Styles */
    #main-content:focus {
      outline: none;
    }
    #main-content:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 2px;
    }

    /* Splash Screen Animation */
    @keyframes pulse-logo {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .splash-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .splash-logo {
      width: 150px;
      height: 150px;
      object-fit: contain;
      animation: pulse-logo 2s ease-in-out infinite;
    }
  </style>


</head>

<body>
  <div id="root">
    <div class="splash-container">
      <img src="/MANIFEST.png" alt="Manifest MS Logo" class="splash-logo" />
    </div>
  </div>

  <script type="module" src="/index.tsx"></script>
</body>

</html>
