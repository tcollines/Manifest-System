<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/MANIFEST.png" />
  <link rel="apple-touch-icon" href="/MANIFEST.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <title>Manifest MS</title>

  <script>
    // NICER ERROR LOGGER (Connection Status Manager)
    let offlineTimeout = null;

    function showConnectionStatus(isOnline, isTransient = false) {
      const isAuthPage = window.location.pathname === '/' || window.location.pathname.startsWith('/forms/auth');
      let errorContainer = document.getElementById('error-container');
      
      // Do not show the global connection pill on login screens, they have their own inline warnings
      if (isAuthPage) {
         if (errorContainer && errorContainer.parentNode) {
            errorContainer.parentNode.removeChild(errorContainer);
         }
         return;
      }
      
      if (!errorContainer) {
        errorContainer = document.createElement('div');
        errorContainer.id = 'error-container';
        errorContainer.style.position = 'fixed';
        errorContainer.style.bottom = '24px';
        errorContainer.style.left = '50%';
        errorContainer.style.transform = 'translateX(-50%)';
        errorContainer.style.backgroundColor = '#1F2937';
        errorContainer.style.color = '#F9FAFB';
        errorContainer.style.padding = '10px 20px';
        errorContainer.style.borderRadius = '30px';
        errorContainer.style.boxShadow = '0 4px 12px rgba(0, 0, 0, 0.15)';
        errorContainer.style.zIndex = '9999';
        errorContainer.style.fontFamily = 'Inter, sans-serif';
        errorContainer.style.fontSize = '14px';
        errorContainer.style.fontWeight = '500';
        errorContainer.style.display = 'flex';
        errorContainer.style.alignItems = 'center';
        errorContainer.style.justifyContent = 'center';
        errorContainer.style.whiteSpace = 'nowrap';
        errorContainer.style.transition = 'all 0.3s ease';
        document.body.appendChild(errorContainer);
      }

      if (offlineTimeout) {
        clearTimeout(offlineTimeout);
        offlineTimeout = null;
      }

      if (isOnline) {
         errorContainer.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px;"><polyline points="20 6 9 17 4 12"></polyline></svg> <span style="color: #4ade80;">Back online</span>';
         
         // Auto hide the success message after 3 seconds
         offlineTimeout = setTimeout(() => {
           if (errorContainer && errorContainer.parentNode) {
             errorContainer.parentNode.removeChild(errorContainer);
           }
         }, 3000);
      } else {
         errorContainer.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> <span>No Internet Connection</span>';
         
         // If browser thinks it's online but a transient error fired, auto-hide so it doesn't get stuck forever.
         // Otherwise, if genuinely offline, it stays visible indefinitely!
         if (navigator.onLine && isTransient) {
            offlineTimeout = setTimeout(() => {
               if (errorContainer && errorContainer.parentNode) {
                 errorContainer.parentNode.removeChild(errorContainer);
               }
            }, 5000);
         }
      }
    }
    // Track if a UI crash occurred so we can automatically recover the app when back online
    let appHasFatalError = false;
    let currentlyOnline = true; // Assume online on initial load

    async function handleNetworkChange() {
      if (navigator.onLine === false) {
         if (currentlyOnline) {
             currentlyOnline = false;
             showConnectionStatus(false, false);
         }
      } else {
        if (!currentlyOnline) {
          currentlyOnline = true;
          showConnectionStatus(true, false);
          if (appHasFatalError) {
            setTimeout(() => window.location.reload(), 2000);
          }
        }
      }
    }

    // Bind to native browser network events
    window.addEventListener('offline', handleNetworkChange);
    window.addEventListener('online', handleNetworkChange);

    window.addEventListener('error', function (e) {
      if (e.message && e.message.includes('ResizeObserver')) return;
      appHasFatalError = true;
    }, true);

    window.addEventListener('unhandledrejection', function (e) {
      appHasFatalError = true;
    });
  </script>
  <!-- Google Sign-In Script is now loaded dynamically in SignIn.tsx -->
  <!-- Google Maps API Config handled via React components -->
  <script>
    // Polyfill process.env for browser environments to prevent crashes
    window.process = {
      env: {
        API_KEY: '', // Value will be injected or handled by the environment/bundler
        NODE_ENV: 'development'
      }
    };
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F3F4F6;
      color: #111827;
    }

    /* Mobile Optimization: Reduce base font and padding */
    @media (max-width: 640px) {
      body {
        font-size: 14px;
        /* Slightly smaller base font */
      }

      h1 {
        font-size: 1.5rem !important;
      }

      /* Force smaller headings */
      h2 {
        font-size: 1.25rem !important;
      }

      h3 {
        font-size: 1.1rem !important;
      }

      .p-8 {
        padding: 1rem !important;
      }

      /* Override large paddings */
      .gap-8 {
        gap: 1rem !important;
      }
    }

    /* Custom Scrollbar - Light Theme */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #F3F4F6;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #FF5722;
    }

    /* Hide Spinners for Number Inputs */
    .no-spinner::-webkit-outer-spin-button,
    .no-spinner::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .no-spinner {
      -moz-appearance: textfield;
      appearance: none;
    }

    /* Hide scrollbar for horizontally scrollable tabs */
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }

    /* Global Scroll Anchor Offset for Sticky Headers */
    /* Removed scroll-behavior: smooth; to prevent interference with manual ScrollRestoration */
    :target {
      scroll-margin-top: 5rem; /* Account for sticky top navbars */
    }

    /* Accessibility Focus Styles */
    #main-content:focus {
      outline: none;
    }
    #main-content:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 2px;
    }

    /* Splash Screen Animation */
    @keyframes pulse-logo {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .splash-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .splash-logo {
      width: 150px;
      height: 150px;
      object-fit: contain;
      animation: pulse-logo 2s ease-in-out infinite;
    }
  </style>


</head>

<body>
  <div id="root">
    <div class="splash-container" id="initial-splash">
      <img src="/MANIFEST.png" alt="Manifest MS Logo" class="splash-logo" />
    </div>
    <script>
      // Hide the internal Manifest splash screen for public forms
      if (window.location.pathname.startsWith('/forms/f/')) {
        var splash = document.getElementById('initial-splash');
        if (splash) {
          splash.style.display = 'none';
          document.body.style.backgroundColor = '#f9fafb'; // gray-50 background for seamless transition
        }
      }
    </script>
  </div>

  <script type="module" src="/index.tsx"></script>
</body>

</html>
