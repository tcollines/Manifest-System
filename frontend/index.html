  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // AGGRESSIVE ERROR LOGGER
    window.addEventListener('error', function (e) {
      const errorContainer = document.getElementById('error-container') || document.createElement('div');
      errorContainer.id = 'error-container';
      errorContainer.style.position = 'fixed';
      errorContainer.style.top = '0';
      errorContainer.style.left = '0';
      errorContainer.style.width = '100%';
      errorContainer.style.backgroundColor = '#fae8e8';
      errorContainer.style.color = '#c0392b';
      errorContainer.style.padding = '20px';
      errorContainer.style.zIndex = '9999';
      errorContainer.style.borderBottom = '2px solid #e74c3c';
      errorContainer.style.fontFamily = 'monospace';
      errorContainer.style.fontSize = '14px';

      let msg = '';
      if (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK') {
        msg = 'Resource Failed to Load: ' + (e.target.src || e.target.href);
      } else {
        msg = e.message;
      }

      errorContainer.innerHTML += '<strong>Error:</strong> ' + msg + '<br>';
      document.body.prepend(errorContainer);
    }, true); // Capture phase to get resource errors

    window.addEventListener('unhandledrejection', function (e) {
      const errorContainer = document.getElementById('error-container') || document.createElement('div');
      errorContainer.innerHTML += '<strong>Promise Error:</strong> ' + (e.reason ? e.reason.message : e.reason) + '<br>';
      document.body.prepend(errorContainer);
    });
  </script>
  <!-- Google Sign-In Script is now loaded dynamically in SignIn.tsx -->
  <!-- Google Maps API Config handled via React components -->
  <script>
    // Polyfill process.env for browser environments to prevent crashes
    window.process = {

        NODE_ENV: 'development'
      }
    };
  </script>
